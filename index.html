<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthyGO Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =========================
   THEME GREEN (HEALTHYGO)
========================= */

body{
  margin:0;
  font-family:Arial;
  background:#071a12;
  color:white;
}

.header{
  background:#052e16;
  color:#22c55e;
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
}

.nav{
  display:flex;
}

.nav button{
  flex:1;
  padding:14px;
  border:none;
  background:#0b2a1a;
  color:white;
  font-weight:bold;
}

.nav button.active{
  background:#22c55e;
  color:black;
}

.page{
  display:none;
  padding:15px;
}

.page.active{
  display:block;
}

/* SCANNER */
#reader{
  width:100%;
  border-radius:15px;
  overflow:hidden;
  border:3px solid #22c55e;
  background:black;
}

#result{
  margin-top:15px;
  padding:15px;
  background:#0b2a1a;
  border-radius:12px;
  text-align:center;
  font-size:18px;
}

/* BUTTON */
.controls{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.controls button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.btn-camera{
  background:#22c55e;
}

.btn-reset{
  background:#14532d;
  color:white;
}

/* CARD */
.card{
  background:#0b2a1a;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
}

.card-title{
  color:#86efac;
  margin-bottom:5px;
}

.card-value{
  font-size:28px;
  font-weight:bold;
}

.blue{color:#60a5fa;}
.green{color:#4ade80;}
.red{color:#f87171;}

/* PROGRESS */
.progress-container{
  background:#1f3d2b;
  height:25px;
  border-radius:50px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#22c55e;
}

.progress-text{
  margin-top:8px;
  font-weight:bold;
}

/* TABLE */
.area-table{
  width:100%;
  border-collapse:collapse;
}

.area-table th{
  background:#14532d;
  padding:10px;
}

.area-table td{
  background:#0b2a1a;
  padding:10px;
  text-align:center;
}

</style>

</head>

<body>

<div class="header">HEALTHYGO SCANNER</div>

<div class="nav">
  <button class="active" onclick="showPage('scan',this)">SCAN</button>
  <button onclick="showPage('dashboard',this)">DASHBOARD</button>
</div>

<!-- SCAN -->
<div id="scan" class="page active">

  <div id="reader"></div>

  <div id="result">Ready...</div>

  <div class="controls">
    <button class="btn-camera" onclick="switchCamera()">Switch</button>
    <button class="btn-reset" onclick="resetScanner()">Reset</button>
  </div>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">

  <div class="card">
    <div class="card-title">TOTAL QTY</div>
    <div class="card-value blue" id="totalBox">0</div>
  </div>

  <div class="card">
    <div class="card-title">SUDAH SCAN</div>
    <div class="card-value green" id="scannedBox">0</div>
  </div>

  <div class="card">
    <div class="card-title">BELUM SCAN</div>
    <div class="card-value red" id="pendingBox">0</div>
  </div>

  <div class="card">
    <div class="card-title">PROGRESS</div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="progress-text" id="progressText">0%</div>
  </div>

  <div class="card">
    <div class="card-title">AREA (A-Z)</div>

    <table class="area-table">
      <thead>
        <tr>
          <th>AREA</th>
          <th>TOTAL</th>
          <th>SCANNED</th>
          <th>PENDING</th>
          <th>%</th>
        </tr>
      </thead>

      <tbody id="areaTable"></tbody>
    </table>

  </div>

</div>

<script>

const WEB_APP_URL = "YOUR_WEBAPP_URL_HERE";

let scanner;
let currentCamera = "environment";
let lastScan = "";

// PAGE
function showPage(page,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  if(page==="dashboard") loadDashboard();
}

// STATUS COLOR
function updateStatus(text,type="info"){
  const el=document.getElementById("result");
  el.innerHTML=text;

  if(type==="success") el.style.color="#4ade80";
  else if(type==="error") el.style.color="#f87171";
  else el.style.color="white";
}

// SCAN
function onScanSuccess(decodedText){

  if(decodedText===lastScan) return;
  lastScan=decodedText;

  updateStatus("Scanning: "+decodedText);

  fetch(WEB_APP_URL,{
    method:"POST",
    body:JSON.stringify({boxId:decodedText})
  })
  .then(r=>r.text())
  .then(data=>{

    if(data==="SCAN BERHASIL") updateStatus(data,"success");
    else updateStatus(data,"error");

    loadDashboard();

    setTimeout(()=>lastScan="",3000);
  })
  .catch(err=>updateStatus(err,"error"));
}

// CAMERA
async function startScanner(){
  scanner=new Html5Qrcode("reader");

  await scanner.start(
    {facingMode:currentCamera},
    {fps:10,qrbox:250},
    onScanSuccess
  );
}

async function switchCamera(){
  await scanner.stop();
  currentCamera=currentCamera==="environment"?"user":"environment";
  startScanner();
}

function resetScanner(){
  lastScan="";
  updateStatus("Reset");
}

// DASHBOARD
function loadDashboard(){

  fetch(WEB_APP_URL+"?dashboard=1")
  .then(r=>r.json())
  .then(data=>{

    document.getElementById("totalBox").innerHTML=data.total;
    document.getElementById("scannedBox").innerHTML=data.scanned;
    document.getElementById("pendingBox").innerHTML=data.pending;

    document.getElementById("progressBar").style.width=data.progress+"%";
    document.getElementById("progressText").innerHTML=data.progress+"%";

    let html="";

    data.areas
      .sort((a,b)=>a.area.localeCompare(b.area)) // A-Z
      .forEach(a=>{

        html+=`
        <tr>
          <td>${a.area}</td>
          <td>${a.total}</td>
          <td>${a.scanned}</td>
          <td>${a.pending}</td>
          <td>${a.progress}%</td>
        </tr>`;
      });

    document.getElementById("areaTable").innerHTML=html;

  });
}

startScanner();
loadDashboard();
setInterval(loadDashboard,5000);

</script>

</body>
</html>
