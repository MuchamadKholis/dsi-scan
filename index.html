<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DSI SCANNER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.header{
  background:#111827;
  padding:20px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

.nav{
  display:flex;
}

.nav button{
  flex:1;
  padding:16px;
  border:none;
  background:#1e293b;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.nav button.active{
  background:#2563eb;
}

.page{
  display:none;
  padding:20px;
}

.page.active{
  display:block;
}

#reader{
  width:100%;
  border-radius:20px;
  overflow:hidden;
  border:4px solid #22c55e;
  background:black;
}

#result{
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  background:#1e293b;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.controls button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
}

.btn-camera{
  background:#2563eb;
  color:white;
}

.btn-reset{
  background:#374151;
  color:white;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

.card-title{
  color:#94a3b8;
  margin-bottom:10px;
  font-size:16px;
}

.card-value{
  font-size:36px;
  font-weight:bold;
}

.blue{
  color:#60a5fa;
}

.green{
  color:#4ade80;
}

.red{
  color:#f87171;
}

.progress-container{
  width:100%;
  height:30px;
  background:#334155;
  border-radius:999px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  background:#22c55e;
  width:0%;
}

.progress-text{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
}

.area-table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

.area-table th{
  background:#2563eb;
  padding:12px;
}

.area-table td{
  background:#1e293b;
  padding:12px;
  text-align:center;
  border-bottom:1px solid #334155;
}

</style>

</head>

<body>

<div class="header">
DSI SCANNER
</div>

<div class="nav">

<button class="active"
        onclick="showPage('scan',this)">
SCAN
</button>

<button onclick="showPage('dashboard',this)">
DASHBOARD
</button>

</div>

<!-- SCAN -->

<div id="scan"
     class="page active">

<div id="reader"></div>

<div id="result">
Loading Camera...
</div>

<div class="controls">

<button class="btn-camera"
        onclick="switchCamera()">
Switch Camera
</button>

<button class="btn-reset"
        onclick="resetScanner()">
Reset
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard"
     class="page">

<div class="card">

<div class="card-title">
TOTAL QTY BOX
</div>

<div class="card-value blue"
     id="totalBox">
0
</div>

</div>

<div class="card">

<div class="card-title">
QTY SUDAH DISCAN
</div>

<div class="card-value green"
     id="scannedBox">
0
</div>

</div>

<div class="card">

<div class="card-title">
QTY BELUM DISCAN
</div>

<div class="card-value red"
     id="pendingBox">
0
</div>

</div>

<div class="card">

<div class="card-title">
PROGRESS SCAN
</div>

<div class="progress-container">

<div class="progress-bar"
     id="progressBar">
</div>

</div>

<div class="progress-text"
     id="progressText">
0%
</div>

</div>

<div class="card">

<div class="card-title">
SUMMARY PER AREA
</div>

<table class="area-table">

<thead>

<tr>

<th>AREA</th>
<th>TOTAL</th>
<th>SCANNED</th>
<th>PENDING</th>
<th>%</th>

</tr>

</thead>

<tbody id="areaTable">
</tbody>

</table>

</div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbycsmnALJWtDrEKDICegAFs3jKHTtWvloIOQzWevT9OUAByQtvj4Skikf1DJg94c-rC/exec";

let scanner;

let currentCamera = "environment";

let lastScan = "";

function showPage(page,btn){

  document
    .querySelectorAll(".page")
    .forEach(p => {
      p.classList.remove("active");
    });

  document
    .getElementById(page)
    .classList.add("active");

  document
    .querySelectorAll(".nav button")
    .forEach(b => {
      b.classList.remove("active");
    });

  btn.classList.add("active");

  if(page == "dashboard"){

    loadDashboard();

  }

}

function beep(){

  const audio =
    new Audio(
      "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

  audio.play();

}

function vibrate(){

  if(navigator.vibrate){

    navigator.vibrate(200);

  }

}

function updateStatus(text){

  document
    .getElementById("result")
    .innerHTML = text;

}

function onScanSuccess(decodedText){

  if(decodedText == lastScan){
    return;
  }

  lastScan = decodedText;

  beep();

  vibrate();

  updateStatus(
    "Scanning : " + decodedText
  );

  fetch(WEB_APP_URL, {

    method:"POST",

    mode:"cors",

    headers:{
      "Content-Type":"text/plain"
    },

    body:JSON.stringify({
      boxId:decodedText
    })

  })

  .then(res => res.text())

  .then(data => {

    updateStatus(data);

    loadDashboard();

    setTimeout(() => {

      lastScan = "";

    },3000);

  })

  .catch(err => {

    updateStatus(err);

  });

}

async function startScanner(){

  scanner =
    new Html5Qrcode("reader");

  await scanner.start(

    {
      facingMode:currentCamera
    },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    },

    onScanSuccess

  );

  updateStatus(
    "📷 Camera Ready"
  );

}

async function switchCamera(){

  try{

    await scanner.stop();

    currentCamera =
      currentCamera == "environment"
      ? "user"
      : "environment";

    startScanner();

  }

  catch(err){

    updateStatus(err);

  }

}

function resetScanner(){

  lastScan = "";

  updateStatus(
    "Scanner Reset"
  );

}

async function loadDashboard(){

  try{

    const res =
      await fetch(
        WEB_APP_URL + "?dashboard=1"
      );

    const data =
      await res.json();

    document
      .getElementById("totalBox")
      .innerHTML =
      data.total;

    document
      .getElementById("scannedBox")
      .innerHTML =
      data.scanned;

    document
      .getElementById("pendingBox")
      .innerHTML =
      data.pending;

    document
      .getElementById("progressBar")
      .style.width =
      data.progress + "%";

    document
      .getElementById("progressText")
      .innerHTML =
      data.progress + "%";

    let html = "";

    data.areas.forEach(a => {

      html += `

      <tr>

        <td>${a.area}</td>

        <td>${a.total}</td>

        <td>${a.scanned}</td>

        <td>${a.pending}</td>

        <td>${a.progress}%</td>

      </tr>

      `;

    });

    document
      .getElementById("areaTable")
      .innerHTML =
      html;

  }

  catch(err){

    console.log(err);

  }

}

startScanner();

loadDashboard();

setInterval(loadDashboard,5000);

</script>

</body>

</html>
