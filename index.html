<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <style>

    body{

      font-family: Arial;
      background:#f5f5f5;
      text-align:center;
      padding-top:50px;

    }

    .container{

      width:400px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);

    }

    h1{

      margin-bottom:30px;

    }

    input{

      width:100%;
      padding:15px;
      font-size:20px;
      text-align:center;
      box-sizing:border-box;

    }

    #result{

      margin-top:25px;
      font-size:28px;
      font-weight:bold;

    }

    .success{

      color:green;

    }

    .error{

      color:red;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>SCAN BOX</h1>

    <input
      type="text"
      id="barcode"
      placeholder="SCAN BARCODE..."
      autofocus
    >

    <div id="result"></div>

  </div>

  <script>

    // GANTI DENGAN URL WEB APP APPS SCRIPT
    const WEB_APP_URL =
      "PASTE_WEB_APP_URL_DISINI";

    const input =
      document.getElementById("barcode");

    const result =
      document.getElementById("result");

    // AUTO FOCUS
    setInterval(() => {

      input.focus();

    }, 1000);

    // ENTER SETELAH SCAN
    input.addEventListener(
      "keypress",
      function(e){

        if(e.key === "Enter"){

          const barcode =
            input.value.trim();

          // JIKA KOSONG
          if(barcode == ""){

            return;

          }

          // TAMPILKAN LOADING
          result.innerHTML =
            "PROCESSING...";

          result.className = "";

          fetch(
            WEB_APP_URL,
            {

              method:"POST",

              body:JSON.stringify({

                boxId: barcode

              })

            }
          )

          .then(response => response.text())

          .then(msg => {

            result.innerHTML = msg;

            // WARNA HIJAU
            if(msg == "SCAN BERHASIL"){

              result.className =
                "success";

            }

            // WARNA MERAH
            else{

              result.className =
                "error";

            }

            // RESET INPUT
            input.value = "";

            input.focus();

          })

          .catch(err => {

            result.innerHTML =
              "ERROR CONNECTION";

            result.className =
              "error";

          });

        }

      });

  </script>

</body>

</html>
