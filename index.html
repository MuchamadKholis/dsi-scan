<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DSI Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.header{
  background:#111827;
  padding:20px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

.nav{
  display:flex;
}

.nav button{
  flex:1;
  padding:16px;
  border:none;
  background:#1e293b;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.nav button.active{
  background:#2563eb;
}

.page{
  display:none;
  padding:20px;
}

.page.active{
  display:block;
}

#reader{
  width:100%;
  border-radius:20px;
  overflow:hidden;
  border:4px solid #22c55e;
  background:black;
}

#result{
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  background:#1e293b;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.controls button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
}

.btn-camera{
  background:#2563eb;
  color:white;
}

.btn-reset{
  background:#374151;
  color:white;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

.card-title{
  color:#94a3b8;
  margin-bottom:10px;
  font-size:16px;
}

.card-value{
  font-size:36px;
  font-weight:bold;
}

.blue{
  color:#60a5fa;
}

.green{
  color:#4ade80;
}

.red{
  color:#f87171;
}

.area-table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

.area-table th{
  background:#2563eb;
  padding:12px;
}

.area-table td{
  background:#1e293b;
  padding:12px;
  text-align:center;
  border-bottom:1px solid #334155;
}

</style>

</head>

<body>

<div class="header">
DSI SCANNER
</div>

<div class="nav">

<button class="active"
        onclick="showPage('scan',this)">
SCAN
</button>

<button onclick="showPage('dashboard',this)">
DASHBOARD
</button>

</div>

<!-- SCAN -->

<div id="scan"
     class="page active">

<div id="reader"></div>

<div id="result">
Loading Camera...
</div>

<div class="controls">

<button class="btn-camera"
        onclick="switchCamera()">
Switch Camera
</button>

<button class="btn-reset"
        onclick="resetScanner()">
Reset
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard"
     class="page">

<div class="card">
<div class="card-title">QTY BOX</div>
<div class="card-value blue"
     id="totalQty">0</div>
</div>

<div class="card">
<div class="card-title">BOX HG</div>
<div class="card-value green"
     id="hgQty">0</div>
</div>

<div class="card">
<div class="card-title">BOX BK</div>
<div class="card-value red"
     id="bkQty">0</div>
</div>

<div class="card">
<div class="card-title">QTY SCANNED</div>
<div class="card-value green"
     id="scannedQty">0</div>
</div>

<div class="card">
<div class="card-title">HG SCANNED</div>
<div class="card-value green"
     id="hgScanned">0</div>
</div>

<div class="card">
<div class="card-title">BK SCANNED</div>
<div class="card-value green"
     id="bkScanned">0</div>
</div>

<div class="card">
<div class="card-title">QTY PENDING</div>
<div class="card-value red"
     id="pendingQty">0</div>
</div>

<div class="card">
<div class="card-title">HG PENDING</div>
<div class="card-value red"
     id="hgPending">0</div>
</div>

<div class="card">
<div class="card-title">BK PENDING</div>
<div class="card-value red"
     id="bkPending">0</div>
</div>

<div class="card">

<div class="card-title">
SUMMARY PER AREA
</div>

<table class="area-table">

<thead>

<tr>

<th>AREA</th>
<th>BRANCH</th>
<th>QTY</th>
<th>SCANNED</th>
<th>PENDING</th>

</tr>

</thead>

<tbody id="areaTable">
</tbody>

</table>

</div>

</div>

<script>

const WEB_APP_URL =
"PASTE_WEB_APP_URL_DISINI";

let scanner;

let currentCamera = "environment";

let lastScan = "";

// NAVIGATION

function showPage(page,btn){

  document
    .querySelectorAll(".page")
    .forEach(p => {
      p.classList.remove("active");
    });

  document
    .getElementById(page)
    .classList.add("active");

  document
    .querySelectorAll(".nav button")
    .forEach(b => {
      b.classList.remove("active");
    });

  btn.classList.add("active");

  if(page == "dashboard"){
    loadDashboard();
  }

}

// SOUND

function beep(){

  const audio =
    new Audio(
      "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

  audio.play();

}

// VIBRATE

function vibrate(){

  if(navigator.vibrate){
    navigator.vibrate(200);
  }

}

// STATUS COLOR

function updateStatus(text){

  const result =
    document.getElementById("result");

  result.innerHTML = text;

  result.style.color = "white";
  result.style.background = "#1e293b";

  if(text.includes("SCAN BERHASIL")){

    result.style.color = "#4ade80";
    result.style.background = "#052e16";

  }

  else if(

    text.includes("BOX TIDAK DITEMUKAN") ||

    text.includes("BOX SUDAH DISCAN") ||

    text.includes("ERROR")

  ){

    result.style.color = "#f87171";
    result.style.background = "#450a0a";

  }

}

// SCAN SUCCESS

function onScanSuccess(decodedText){

  if(decodedText == lastScan){
    return;
  }

  lastScan = decodedText;

  beep();

  vibrate();

  updateStatus(
    "Scanning : " + decodedText
  );

  fetch(WEB_APP_URL, {

    method:"POST",

    mode:"cors",

    headers:{
      "Content-Type":"text/plain"
    },

    body:JSON.stringify({
      boxId:decodedText
    })

  })

  .then(res => res.text())

  .then(data => {

    updateStatus(data);

    loadDashboard();

    setTimeout(() => {

      lastScan = "";

    },3000);

  })

  .catch(err => {

    updateStatus(err);

  });

}

// START CAMERA

async function startScanner(){

  scanner =
    new Html5Qrcode("reader");

  await scanner.start(

    {
      facingMode:currentCamera
    },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    },

    onScanSuccess

  );

  updateStatus(
    "📷 Camera Ready"
  );

}

// SWITCH CAMERA

async function switchCamera(){

  try{

    await scanner.stop();

    currentCamera =
      currentCamera == "environment"
      ? "user"
      : "environment";

    startScanner();

  }

  catch(err){

    updateStatus(err);

  }

}

// RESET

function resetScanner(){

  lastScan = "";

  updateStatus(
    "Scanner Reset"
  );

}

// DASHBOARD

async function loadDashboard(){

  try{

    const res =
      await fetch(
        WEB_APP_URL + "?dashboard=1"
      );

    const data =
      await res.json();

    document.getElementById("totalQty")
      .innerHTML = data.totalQty;

    document.getElementById("hgQty")
      .innerHTML = data.hgQty;

    document.getElementById("bkQty")
      .innerHTML = data.bkQty;

    document.getElementById("scannedQty")
      .innerHTML = data.scannedQty;

    document.getElementById("hgScanned")
      .innerHTML = data.hgScanned;

    document.getElementById("bkScanned")
      .innerHTML = data.bkScanned;

    document.getElementById("pendingQty")
      .innerHTML = data.pendingQty;

    document.getElementById("hgPending")
      .innerHTML = data.hgPending;

    document.getElementById("bkPending")
      .innerHTML = data.bkPending;

    let html = "";

    data.areas.forEach(a => {

      html += `

      <tr>

        <td>${a.area}</td>

        <td>${a.branch}</td>

        <td>${a.qty}</td>

        <td>${a.scanned}</td>

        <td>${a.pending}</td>

      </tr>

      `;

    });

    document
      .getElementById("areaTable")
      .innerHTML = html;

  }

  catch(err){

    console.log(err);

  }

}

startScanner();

loadDashboard();

setInterval(loadDashboard,5000);

</script>

</body>
</html>
