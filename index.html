<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSI SCANNER</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#111827;
  color:white;
  text-align:center;
  padding:20px;
}

.container{
  max-width:420px;
  margin:auto;
}

.title{
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
}

.subtitle{
  color:#9ca3af;
  margin-bottom:20px;
}

#reader{
  width:100%;
  border-radius:20px;
  overflow:hidden;
  border:4px solid #22c55e;
  background:black;
}

.status-box{
  margin-top:20px;
  padding:15px;
  border-radius:15px;
  font-size:20px;
  font-weight:bold;
  background:#1f2937;
  min-height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.success{
  background:#14532d !important;
  color:#4ade80;
}

.error{
  background:#7f1d1d !important;
  color:#f87171;
}

.info{
  background:#1e3a8a !important;
  color:#60a5fa;
}

.controls{
  margin-top:20px;
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.9;
}

.btn-camera{
  background:#2563eb;
  color:white;
}

.btn-reset{
  background:#374151;
  color:white;
}

.scan-history{
  margin-top:25px;
  text-align:left;
}

.scan-history h3{
  margin-bottom:10px;
}

.history-item{
  background:#1f2937;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:14px;
}

.footer{
  margin-top:25px;
  color:#6b7280;
  font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
DSI SCANNER
</div>

<div class="subtitle">
Warehouse QR Box Scanner
</div>

<div id="reader"></div>

<div id="result" class="status-box info">
Starting Camera...
</div>

<div class="controls">

<button class="btn-camera"
        onclick="switchCamera()">
Switch Camera
</button>

<button class="btn-reset"
        onclick="resetScanner()">
Reset
</button>

</div>

<div class="scan-history">

<h3>Recent Scan</h3>

<div id="history"></div>

</div>

<div class="footer">
Powered by KHOLIS
</div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzagb0Z61W55ZBHlgE23FbwXCqca3wz3YvO4KMbiQm-n9qSV_iwZonSQIAisC3zBEc/exec";

let scanner;

let currentCamera = "environment";

let lastScan = "";

function beep(){

  const audio =
    new Audio(
      "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

  audio.play();

}

function vibrate(){

  if(navigator.vibrate){

    navigator.vibrate(200);

  }

}

function updateStatus(message,type){

  const result =
    document.getElementById("result");

  result.className =
    "status-box " + type;

  result.innerHTML = message;

}

function addHistory(text){

  const history =
    document.getElementById("history");

  const item =
    document.createElement("div");

  item.className = "history-item";

  item.innerHTML =
    `
    <b>${text}</b><br>
    ${new Date().toLocaleTimeString()}
    `;

  history.prepend(item);

}

function onScanSuccess(decodedText){

  if(decodedText == lastScan){
    return;
  }

  lastScan = decodedText;

  beep();

  vibrate();

  updateStatus(
    "Scanning : " + decodedText,
    "info"
  );

  fetch(WEB_APP_URL, {

    method:"POST",

    mode:"cors",

    headers:{
      "Content-Type":"text/plain"
    },

    body:JSON.stringify({
      boxId:decodedText
    })

  })

  .then(res => res.text())

  .then(data => {

    if(data.includes("BERHASIL")){

      updateStatus(
        "✅ " + data,
        "success"
      );

    }

    else{

      updateStatus(
        "❌ " + data,
        "error"
      );

    }

    addHistory(decodedText);

    setTimeout(() => {

      lastScan = "";

    },3000);

  })

  .catch(err => {

    updateStatus(
      "ERROR : " + err,
      "error"
    );

  });

}

async function startScanner(){

  scanner =
    new Html5Qrcode("reader");

  await scanner.start(

    {
      facingMode:currentCamera
    },

    {
      fps:10,

      qrbox:{
        width:250,
        height:250
      }

    },

    onScanSuccess

  );

  updateStatus(
    "📷 Camera Ready",
    "info"
  );

}

async function switchCamera(){

  try{

    await scanner.stop();

    currentCamera =
      currentCamera == "environment"
      ? "user"
      : "environment";

    startScanner();

  }

  catch(err){

    updateStatus(
      err,
      "error"
    );

  }

}

function resetScanner(){

  lastScan = "";

  updateStatus(
    "Scanner Reset",
    "info"
  );

}

startScanner();

</script>

</body>

</html>
